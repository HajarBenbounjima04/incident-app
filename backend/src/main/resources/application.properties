server.port=8080

# --- H2 (par defaut) ---
spring.datasource.url=jdbc:h2:mem:incidentdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (decommenter pour l'utiliser) ---
#spring.datasource.url=jdbc:mysql://localhost:3306/incidentdb?createDatabaseIfNotExist=true&serverTimezone=UTC
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
app.jwt.secret=change-me-this-secret-must-be-at-least-32-bytes-long-0123456789
# 5 minutes pour tester l'expiration (access token)
app.jwt.access-expiration-ms=300000
# 7 jours (refresh token)
app.jwt.refresh-expiration-ms=604800000

# --- CORS ---
app.cors.allowed-origin=http://localhost:5173
